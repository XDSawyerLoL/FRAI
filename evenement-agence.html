<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Événement — Agenda emploi</title><style>body{margin:0;background:#f5f7fa;font-family:Arial,"Segoe UI",sans-serif;color:#1f2937}.wrap{max-width:860px;margin:auto;padding:20px}.card{background:#fff;border:1px solid #d0d5dd;border-radius:14px;overflow:hidden}.hero{width:100%;max-height:340px;object-fit:cover;display:none;background:#eef2f6}.body{padding:22px}.badge{display:inline-flex;padding:5px 9px;border-radius:999px;background:#fff5e6;border:1px solid #f5c77e;color:#8a4b00;font-size:11px;font-weight:800}.title{font-size:28px;line-height:1.2;margin:12px 0}.meta{display:grid;gap:7px;color:#475467;font-size:14px}.desc{margin-top:18px;white-space:pre-wrap;line-height:1.55}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}.btn{display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:0 14px;border-radius:8px;background:#0063cb;color:#fff;text-decoration:none;font-weight:800}.btn.secondary{background:#fff;color:#0057b8;border:1px solid #a8cdf2}.error{padding:30px;text-align:center;color:#667085}@media(max-width:600px){.wrap{padding:8px}.body{padding:16px}.title{font-size:23px}}</style></head><body><main class="wrap"><section id="card" class="card"><div id="loading" class="error">Chargement de l’événement…</div></section></main><script>const API='https://frai-agency-events.onrender.com';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const id=new URLSearchParams(location.search).get('id');async function load(){const card=document.getElementById('card');if(!id){card.innerHTML='<div class="error">Événement introuvable.</div>';return}try{const r=await fetch(`${API}/events/${encodeURIComponent(id)}`,{cache:'no-store'});if(!r.ok)throw new Error();const e=await r.json();const date=new Intl.DateTimeFormat('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(new Date(`${e.date}T12:00:00`));card.innerHTML=`${e.image?`<img class="hero" id="hero" src="${esc(e.image)}" alt="">`:''}<div class="body"><span class="badge">Ajout public</span><h1 class="title">${esc(e.title)}</h1><div class="meta"><div><strong>Date :</strong> ${esc(date)}${e.time?` · ${esc(e.time)}${e.end_time?`–${esc(e.end_time)}`:''}`:''}</div><div><strong>Lieu :</strong> ${esc(e.location||e.city)}${e.city&&e.location&&e.location!==e.city?` · ${esc(e.city)}`:''}</div>${e.organizer?`<div><strong>Organisateur :</strong> ${esc(e.organizer)}</div>`:''}${e.capacity?`<div><strong>Places :</strong> ${esc(e.capacity)}</div>`:''}</div>${e.description?`<div class="desc">${esc(e.description)}</div>`:''}<div class="actions">${e.registration_url?`<a class="btn" href="${esc(e.registration_url)}" target="_blank" rel="noopener noreferrer">S’inscrire ↗</a>`:''}<a class="btn secondary" href="evenements.html">Retour à l’agenda</a></div></div>`;document.getElementById('hero')?.style.setProperty('display','block')}catch{card.innerHTML='<div class="error">Cet événement n’est pas disponible.</div>'}}load();</script></body></html>
