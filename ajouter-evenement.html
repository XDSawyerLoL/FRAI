<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ajouter un événement</title>
<style>
:root{--blue:#0063cb;--bg:#f5f7fa;--text:#101828;--muted:#667085;--line:#d0d5dd}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,"Segoe UI",sans-serif;color:var(--text)}.wrap{max-width:820px;margin:28px auto;padding:14px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:0 12px 32px rgba(16,24,40,.08)}h1{margin:0 0 6px;font-size:26px}.sub{font-size:13px;color:var(--muted);line-height:1.5;margin-bottom:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}label{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:800;color:#344054}input,select,textarea,button{font:inherit;border-radius:9px}input,select,textarea{border:1px solid #aeb8c5;background:#fff;padding:10px 11px}input,select{height:44px}textarea{min-height:105px;resize:vertical}.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:18px}.btn,button{height:42px;display:inline-flex;align-items:center;justify-content:center;padding:0 16px;border-radius:9px;font-size:13px;font-weight:800;text-decoration:none}.btn{border:1px solid var(--line);color:#344054;background:#fff}button{border:0;background:var(--blue);color:#fff;cursor:pointer}.msg{margin-right:auto;font-size:13px;color:var(--muted)}.msg.error{color:#b42318}.msg.ok{color:#067647}.preview{display:none;width:100%;max-height:220px;object-fit:cover;border-radius:10px;border:1px solid #e4e7ec;margin-top:8px}.preview.on{display:block}.success{display:none;margin-top:14px;padding:14px;border-radius:10px;background:#ecfdf3;border:1px solid #abefc6;color:#067647;font-size:13px}.success.on{display:block}.hp{position:absolute;left:-10000px;width:1px;height:1px;overflow:hidden}@media(max-width:680px){.wrap{margin:0 auto;padding:8px}.card{padding:16px}.grid{grid-template-columns:1fr}.full{grid-column:auto}}
</style>
</head>
<body>
<div class="wrap"><div class="card"><h1>Ajouter un événement</h1><div class="sub">Aucun compte n’est nécessaire. L’événement sera ajouté à l’agenda partagé après synchronisation, généralement sous quelques minutes.</div>
<form id="eventForm"><div class="grid">
<label class="full">Titre *<input name="title" maxlength="160" required placeholder="Ex. Atelier recrutement sans CV"></label>
<label>Date *<input id="date" name="date" type="date" required></label>
<label>Catégorie<select name="category"><option value="autre">Autre</option><option value="mrs">MRS</option><option value="jobdating">Job dating</option><option value="alternance">Alternance</option><option value="sanscv">Sans CV</option><option value="ia">IA</option></select></label>
<label>Début<input name="time" type="time"></label><label>Fin<input name="end_time" type="time"></label>
<label>Département *<select name="department" required><option value="92">Hauts-de-Seine (92)</option><option value="75">Paris (75)</option><option value="77">Seine-et-Marne (77)</option><option value="78">Yvelines (78)</option><option value="91">Essonne (91)</option><option value="93">Seine-Saint-Denis (93)</option><option value="94">Val-de-Marne (94)</option><option value="95">Val-d’Oise (95)</option></select></label>
<label>Ville *<input name="city" maxlength="120" required placeholder="Issy-les-Moulineaux"></label>
<label class="full">Adresse / lieu<input name="location" maxlength="240" placeholder="Adresse, agence, salle…"></label>
<label>Organisateur<input name="organizer" maxlength="160"></label><label>Nombre de places<input name="capacity" type="number" min="1" max="100000"></label>
<label class="full">Lien d’inscription<input name="registration_url" type="url" placeholder="https://…"></label>
<label class="full">Description<textarea name="description" maxlength="4000" placeholder="Public visé, programme, modalités…"></textarea></label>
<label class="full">Image<input id="image" type="file" accept="image/jpeg,image/png,image/webp"><span style="font-weight:400;color:#667085">JPG, PNG ou WebP — 800 Ko maximum.</span><img id="preview" class="preview" alt="Aperçu"></label>
<label class="hp" aria-hidden="true">Site web<input name="website" tabindex="-1" autocomplete="off"></label>
</div><div id="success" class="success"></div><div class="actions"><span id="msg" class="msg"></span><a class="btn" href="evenements.html">Retour à l’agenda</a><button id="submit" type="submit">Publier l’événement</button></div></form>
</div></div>
<script>
const API='https://frai-agency-events.onrender.com',MAX_IMAGE=800000,form=document.getElementById('eventForm'),msg=document.getElementById('msg'),btn=document.getElementById('submit'),preview=document.getElementById('preview');document.getElementById('date').min=new Date().toISOString().slice(0,10);
function readImage(file){return new Promise((resolve,reject)=>{if(!file)return resolve('');if(!['image/jpeg','image/png','image/webp'].includes(file.type))return reject(new Error('Format image non autorisé.'));if(file.size>MAX_IMAGE)return reject(new Error('Image trop lourde : 800 Ko maximum.'));const r=new FileReader();r.onload=()=>resolve(String(r.result||''));r.onerror=()=>reject(new Error('Impossible de lire l’image.'));r.readAsDataURL(file)})}
document.getElementById('image').addEventListener('change',e=>{const f=e.target.files?.[0];if(!f){preview.classList.remove('on');return}const u=URL.createObjectURL(f);preview.src=u;preview.classList.add('on');preview.onload=()=>URL.revokeObjectURL(u)});
form.addEventListener('submit',async e=>{e.preventDefault();btn.disabled=true;msg.className='msg';msg.textContent='Publication…';try{const fd=new FormData(form),p={};['title','date','time','end_time','department','city','location','category','description','registration_url','organizer','capacity','website'].forEach(k=>p[k]=fd.get(k)||'');p.image=await readImage(document.getElementById('image').files?.[0]);const r=await fetch(API+'/events',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)});const data=await r.json().catch(()=>({}));if(!r.ok)throw new Error(data.error||'Publication impossible.');document.getElementById('success').classList.add('on');document.getElementById('success').innerHTML='<strong>Événement publié.</strong><br>Il sera visible dans l’agenda après la prochaine synchronisation automatique.';msg.className='msg ok';msg.textContent='Enregistré.';form.reset();preview.classList.remove('on')}catch(err){msg.className='msg error';msg.textContent=err?.message||'Publication impossible.'}finally{btn.disabled=false}});
</script>
</body></html>
