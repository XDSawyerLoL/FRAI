<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ajouter un événement — FRAI</title>
<style>
:root{--blue:#0063cb;--bg:#f5f7fa;--text:#101828;--muted:#667085;--line:#d0d5dd;--ok:#067647;--okbg:#ecfdf3;--err:#b42318;--errbg:#fef3f2}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,"Segoe UI",sans-serif;color:var(--text)}.wrap{max-width:860px;margin:28px auto;padding:14px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px}.head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:18px}h1{margin:0;font-size:26px}.sub{color:var(--muted);font-size:13px;margin-top:6px;line-height:1.45}.back{color:#0057b8;text-decoration:none;font-weight:700;font-size:13px;white-space:nowrap}.notice{display:none;border-radius:10px;padding:12px 14px;margin-bottom:16px;font-size:13px;font-weight:700}.notice.ok{display:block;background:var(--okbg);color:var(--ok);border:1px solid #abefc6}.notice.err{display:block;background:var(--errbg);color:var(--err);border:1px solid #fecdca}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.full{grid-column:1/-1}.field{display:flex;flex-direction:column;gap:6px}.field label{font-size:12px;font-weight:800}.field small{font-size:11px;color:var(--muted)}input,select,textarea{width:100%;border:1px solid #aeb8c5;border-radius:9px;background:#fff;font:inherit;font-size:14px;color:var(--text)}input,select{height:46px;padding:0 12px}textarea{min-height:130px;padding:11px 12px;resize:vertical}.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}.btn{height:44px;border-radius:9px;border:0;padding:0 18px;font-weight:800;font-size:14px;cursor:pointer}.primary{background:var(--blue);color:#fff}.primary:disabled{opacity:.6;cursor:wait}.secondary{display:inline-flex;align-items:center;background:#eef2f6;color:#344054;text-decoration:none}.honeypot{position:absolute!important;left:-10000px!important;width:1px!important;height:1px!important;overflow:hidden!important}@media(max-width:700px){.wrap{margin:8px auto;padding:8px}.card{padding:16px}.grid{grid-template-columns:1fr}.full{grid-column:auto}.head{flex-direction:column}.actions{flex-direction:column-reverse}.btn,.secondary{width:100%;justify-content:center}}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="head">
      <div><h1>Ajouter un événement</h1><div class="sub">Publication publique dans l’agenda emploi. Aucun compte ni connexion n’est nécessaire.</div></div>
      <a class="back" href="evenements.html">← Retour à l’agenda</a>
    </div>

    <div id="notice" class="notice"></div>

    <form id="eventForm" action="https://frai-agency-events.onrender.com/events" method="post" enctype="multipart/form-data">
      <input type="hidden" name="_browser_form" value="1">
      <div class="honeypot" aria-hidden="true"><label>Site web<input type="text" name="website" tabindex="-1" autocomplete="off"></label></div>

      <div class="grid">
        <div class="field full"><label for="title">Titre *</label><input id="title" name="title" maxlength="160" required placeholder="Ex. Atelier CV & IA"></div>

        <div class="field"><label for="date">Date *</label><input id="date" name="date" type="date" required></div>
        <div class="field"><label for="category">Catégorie</label><select id="category" name="category"><option value="autre">Autre</option><option value="mrs">MRS</option><option value="jobdating">Job dating</option><option value="alternance">Alternance</option><option value="sanscv">Sans CV</option><option value="ia">IA</option></select></div>

        <div class="field"><label for="time">Heure de début</label><input id="time" name="time" type="time"></div>
        <div class="field"><label for="end_time">Heure de fin</label><input id="end_time" name="end_time" type="time"></div>

        <div class="field"><label for="department">Département *</label><select id="department" name="department" required><option value="">Choisir</option><option value="75">Paris (75)</option><option value="77">Seine-et-Marne (77)</option><option value="78">Yvelines (78)</option><option value="91">Essonne (91)</option><option value="92">Hauts-de-Seine (92)</option><option value="93">Seine-Saint-Denis (93)</option><option value="94">Val-de-Marne (94)</option><option value="95">Val-d’Oise (95)</option></select></div>
        <div class="field"><label for="city">Ville *</label><input id="city" name="city" maxlength="120" required placeholder="Ex. Issy-les-Moulineaux"></div>

        <div class="field full"><label for="location">Adresse / lieu</label><input id="location" name="location" maxlength="240" placeholder="Ex. Agence France Travail, 12 rue…"></div>
        <div class="field full"><label for="organizer">Organisateur</label><input id="organizer" name="organizer" maxlength="160" placeholder="Ex. France Travail Issy-les-Moulineaux"></div>

        <div class="field"><label for="capacity">Nombre de places</label><input id="capacity" name="capacity" type="number" min="1" max="100000" inputmode="numeric" placeholder="Ex. 20"></div>
        <div class="field"><label for="registration_url">Lien d’inscription</label><input id="registration_url" name="registration_url" type="url" maxlength="1200" placeholder="https://…"></div>

        <div class="field full"><label for="description">Description</label><textarea id="description" name="description" maxlength="4000" placeholder="Décrivez l’événement, le public concerné, les prérequis…"></textarea></div>
        <div class="field full"><label for="image_file">Image</label><input id="image_file" name="image_file" type="file" accept="image/jpeg,image/png,image/webp"><small>JPG, PNG ou WebP — 800 Ko maximum.</small></div>
      </div>

      <div class="actions"><a class="btn secondary" href="evenements.html">Annuler</a><button id="submitBtn" class="btn primary" type="submit">Publier l’événement</button></div>
    </form>
  </div>
</div>
<script>
(() => {
  const p=new URLSearchParams(location.search), notice=document.getElementById('notice');
  if(p.get('published')==='1'){
    notice.className='notice ok';
    notice.textContent='Événement publié. Il apparaîtra dans l’agenda après la prochaine synchronisation automatique (quelques minutes).';
    document.getElementById('eventForm').reset();
  } else if(p.get('error')){
    notice.className='notice err';
    notice.textContent=p.get('error');
  }
  const d=document.getElementById('date'), now=new Date();
  const iso=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
  d.min=iso;
  document.getElementById('eventForm').addEventListener('submit',()=>{
    const b=document.getElementById('submitBtn');
    b.disabled=true;b.textContent='Publication en cours…';
  });
})();
</script>
</body>
</html>
