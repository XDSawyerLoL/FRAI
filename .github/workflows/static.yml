name: Refresh event calendar data

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "events-idf.js"
      - "events-idf.json"
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "events-data"
  cancel-in-progress: true

jobs:
  refresh-events:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build IDF events data
        run: |
          python3 scripts/build-events-calendar.py
          python3 scripts/build-events-js.py
      - name: Save generated data in the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add events-idf.json events-idf.js
          if git diff --cached --quiet; then
            echo "Event data already up to date."
          else
            git commit -m "Refresh IDF event data"
            git push
          fi
