name: Sync agency events

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "agency-events-sync"
  cancel-in-progress: true

jobs:
  sync-agency-events:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch public agency events
        run: python3 scripts/sync-agency-events.py

      - name: Save synced agency events
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add agency-events-local.js agency-images
          if git diff --cached --quiet; then
            echo "Agency events already up to date."
          else
            git commit -m "Sync public agency events"
            git push
          fi
