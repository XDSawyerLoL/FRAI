name: Sync agency events

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/agency-sync.yml"
      - "scripts/sync-agency-events.py"
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "agency-events-sync"
  cancel-in-progress: true

jobs:
  sync-agency-events:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch public agency events
        run: python3 scripts/sync-agency-events.py

      - name: Save synced agency events
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add agency-events.js agency-images
          if git diff --cached --quiet; then
            echo "Agency events already up to date."
          else
            git commit -m "Sync agency events"
            git push
          fi
