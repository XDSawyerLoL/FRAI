name: Backend public events self-test

on:
  push:
    branches: ["public-agency-events-deploy"]
    paths:
      - "agency-api/**"
      - ".github/workflows/backend-selftest.yml"
  workflow_dispatch:

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Render and test storage
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 18); do
            BODY="$(curl -fsS --max-time 20 https://frai-agency-events.onrender.com/selftest || true)"
            echo "Attempt $i: $BODY"
            if echo "$BODY" | grep -q '"ok":true'; then
              exit 0
            fi
            sleep 10
          done
          echo "Backend self-test failed"
          exit 1
