name: Backend public events self-test

on:
  push:
    branches: ["public-agency-events-deploy"]
    paths:
      - "agency-api/**"
      - ".github/workflows/backend-selftest.yml"
  workflow_dispatch:

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Render and test storage
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 18); do
            BODY="$(curl -fsS --max-time 20 https://frai-agency-events.onrender.com/selftest || true)"
            echo "Attempt $i: $BODY"
            if echo "$BODY" | grep -q '"ok":true'; then
              break
            fi
            if [ "$i" = "18" ]; then
              echo "Backend self-test failed"
              exit 1
            fi
            sleep 10
          done

      - name: Test classic browser form transport
        shell: bash
        run: |
          set -euo pipefail
          HEADERS="$(mktemp)"
          curl -sS --max-time 30 -D "$HEADERS" -o /dev/null \
            -F '_browser_form=1' \
            -F 'website=selftest-bot' \
            https://frai-agency-events.onrender.com/events
          cat "$HEADERS"
          grep -Eq '^HTTP/.* 303' "$HEADERS"
          grep -Eiq '^location: https://xdsawyerlol.github.io/FRAI/ajouter-evenement.html\?published=1' "$HEADERS"
