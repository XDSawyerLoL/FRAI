name: Publish agency events

on:
  issues:
    types: [opened, edited, closed, reopened]
  workflow_dispatch:

permissions:
  contents: write
  issues: read

concurrency:
  group: agency-events
  cancel-in-progress: true

jobs:
  sync-agency-events:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build agency event data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 scripts/sync-agency-events.py

      - name: Save agency event data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add agency-events.json agency-events.js
          if git diff --cached --quiet; then
            echo "Agency event data already up to date."
          else
            git commit -m "Refresh agency event data"
            git pull --rebase origin main
            git push
          fi
