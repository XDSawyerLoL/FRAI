<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Événements emploi — Île-de-France</title>
<style>
:root{--blue:#0063cb;--bg:#f5f7fa;--text:#1f2937;--muted:#667085;--line:#d0d5dd;--oa-crop:545px}
*{box-sizing:border-box}html,body{max-width:100%;overflow-x:hidden}body{margin:0;background:var(--bg);font-family:Arial,"Segoe UI",sans-serif;color:var(--text)}
.app{max-width:1450px;margin:auto;padding:12px}.box{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px}h1{margin:0 0 5px;font-size:22px}.sub{font-size:13px;color:var(--muted);margin-bottom:14px}
.grid{display:grid;grid-template-columns:1fr 326px auto;gap:10px;align-items:end}.field{display:flex;flex-direction:column;gap:5px}.field label{font-size:12px;font-weight:700}input,select,button{height:46px;border-radius:8px;font-size:15px}input,select{border:1px solid #aeb8c5;padding:0 12px;background:#fff}button{border:0;background:var(--blue);color:#fff;font-weight:700;padding:0 18px;cursor:pointer}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:10px}.quick{display:flex;flex-wrap:wrap;gap:7px}.chip{height:34px;background:#eef5ff;color:#064f9c;border:1px solid #bed8f3;border-radius:999px;font-size:13px;padding:0 12px}.view-switch{display:flex;gap:6px}.viewbtn{height:42px;width:52px;padding:0;display:grid;place-items:center;background:#fff;color:#475467;border:1px solid #cbd5e1;border-radius:9px}.viewbtn:hover{background:#f8fafc}.viewbtn.active{background:#e8f2ff;color:#0057b8;border-color:#8ec2f5}.viewbtn svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.info{margin-top:10px;font-size:12px;color:var(--muted)}
.agenda{display:none;margin-top:12px}.agenda.open{display:block}.agenda-layout{display:grid;grid-template-columns:minmax(380px,.9fr) minmax(460px,1.35fr);gap:12px;align-items:start}.agenda-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px}.agenda-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}.agenda-title{font-weight:800;font-size:17px;text-transform:capitalize}.calnav{width:38px;height:36px;padding:0;border:1px solid #cbd5e1;background:#fff;color:#344054;border-radius:8px;font-size:20px}.calnav:hover{background:#f8fafc}.calendar{display:grid;grid-template-columns:repeat(7,minmax(44px,1fr));gap:5px}.dow{text-align:center;font-size:11px;font-weight:800;color:#667085;padding:5px 0}.day{position:relative;min-height:64px;height:auto;padding:6px 4px;border-radius:9px;border:1px solid #e4e7ec;background:#fff;color:#344054;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:5px}.day:hover{border-color:#8dbbea;background:#f4f9ff}.day.other{opacity:.32}.day.today{border-color:#0063cb}.day.selected{background:#e7f2ff;color:#003b74;border-color:#0063cb;box-shadow:inset 0 0 0 1px #0063cb}.daynum{line-height:18px}.dots{min-height:10px;display:flex;align-items:center;justify-content:center;gap:3px;flex-wrap:wrap}.dot{width:7px;height:7px;border-radius:50%;display:inline-block;flex:0 0 auto}.daycount{font-size:10px;color:#667085;font-weight:800;line-height:12px}.day.selected .daycount{color:#0057b8}.dot-mrs{background:#d92d20}.dot-jobdating{background:#1570ef}.dot-alternance{background:#079455}.dot-sanscv{background:#f79009}.dot-ia{background:#7f56d9}.dot-autre{background:#667085}
.legend{display:flex;flex-wrap:wrap;gap:7px 12px;margin:12px 0 4px;font-size:11px;color:#475467}.legend span{display:inline-flex;align-items:center;gap:5px}.legend .dot{width:8px;height:8px}.agenda-data{font-size:11px;color:#667085;margin-top:8px}.agenda-actions{display:flex;justify-content:flex-end;margin-top:10px}.clear-date{height:32px;background:#fff;color:#0057b8;border:1px solid #a8cdf2;padding:0 10px;font-size:12px}
.day-details{padding:0}.day-details-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:10px}.day-details-title{font-size:17px;font-weight:800;text-transform:capitalize}.day-total{font-size:12px;color:#667085;margin-top:3px}.day-empty{font-size:13px;color:#667085;padding:18px 4px}.event-day-list{display:grid;gap:8px}.day-event{display:grid;grid-template-columns:9px 54px minmax(0,1fr);gap:9px;align-items:start;padding:10px;border:1px solid #e4e7ec;border-radius:9px;background:#fff}.day-event:hover{border-color:#bfd7ef;background:#fbfdff}.day-event .edot{width:9px;height:9px;border-radius:50%;margin-top:4px}.etime{font-size:12px;font-weight:800;color:#344054}.etitle{font-size:13px;font-weight:700;color:#101828;line-height:1.3}.elocation{font-size:11px;color:#667085;margin-top:4px;line-height:1.3}.ecat{display:inline-flex;align-items:center;gap:5px;margin-top:5px;font-size:10px;color:#475467}.more-events{width:100%;height:38px;margin-top:10px;background:#eef5ff;color:#0057b8;border:1px solid #b8d7f6;font-size:12px}.more-events:hover{background:#e3f0ff}
.viewer{margin-top:12px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;height:820px;position:relative}.viewer.hidden{display:none}.viewer iframe{position:absolute;left:0;top:calc(-1 * var(--oa-crop));width:100%;height:calc(820px + var(--oa-crop));border:0;display:block;background:#fff}
@media(max-width:980px){.grid{grid-template-columns:1fr 260px auto}.agenda-layout{grid-template-columns:1fr}}
@media(max-width:760px){:root{--oa-crop:610px}.app{padding:6px}.box{padding:12px}.grid{grid-template-columns:1fr}.toolbar{align-items:flex-start}.view-switch{width:100%;justify-content:flex-end}.viewer{height:720px}.viewer iframe{height:calc(720px + var(--oa-crop))}.calendar{grid-template-columns:repeat(7,minmax(38px,1fr));gap:3px}.day{min-height:58px;font-size:12px;padding:4px 2px}.agenda-card{padding:10px}.day-event{grid-template-columns:8px 43px minmax(0,1fr)}}
</style>
</head>
<body>
<main class="app">
<section class="box">
<h1>Recherche événements emploi — Île-de-France</h1>
<div class="sub">Recherche et agenda des événements France Travail en Île-de-France.</div>
<form id="f" class="grid">
<div class="field"><label for="q">Mot-clé</label><input id="q" value="MRS" placeholder="MRS, alternance, job dating…"></div>
<div class="field"><label for="zone">Zone</label><select id="zone"><option value="idf">Toute l’Île-de-France</option><option value="75">Paris (75)</option><option value="77">Seine-et-Marne (77)</option><option value="78">Yvelines (78)</option><option value="91">Essonne (91)</option><option value="92">Hauts-de-Seine (92)</option><option value="93">Seine-Saint-Denis (93)</option><option value="94">Val-de-Marne (94)</option><option value="95">Val-d’Oise (95)</option></select></div>
<button type="submit">Rechercher</button>
</form>
<div class="toolbar">
<div class="quick"><button class="chip" data-q="MRS" type="button">MRS</button><button class="chip" data-q="Job dating" type="button">Job dating</button><button class="chip" data-q="Alternance" type="button">Alternance</button><button class="chip" data-q="Recrutement sans CV" type="button">Sans CV</button><button class="chip" data-q="Intelligence artificielle" type="button">IA</button></div>
<div class="view-switch" aria-label="Mode d’affichage"><button id="listView" class="viewbtn active" type="button" title="Vue liste" aria-label="Vue liste" aria-pressed="true"><svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13"/><path d="M3 6h.01M3 12h.01M3 18h.01"/></svg></button><button id="agendaView" class="viewbtn" type="button" title="Vue agenda" aria-label="Vue agenda" aria-pressed="false"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/><path d="M8 14h.01M12 14h.01M16 14h.01"/></svg></button></div>
</div>
<div class="info" id="status">Recherche prête — Île-de-France uniquement.</div>
</section>

<section id="agendaPanel" class="agenda" aria-hidden="true">
<div class="agenda-layout">
<div class="agenda-card">
<div class="agenda-head"><button id="prevMonth" class="calnav" type="button" aria-label="Mois précédent">‹</button><div id="agendaTitle" class="agenda-title"></div><button id="nextMonth" class="calnav" type="button" aria-label="Mois suivant">›</button></div>
<div id="calendar" class="calendar"></div>
<div class="legend"><span><i class="dot dot-mrs"></i>MRS</span><span><i class="dot dot-jobdating"></i>Job dating</span><span><i class="dot dot-alternance"></i>Alternance</span><span><i class="dot dot-sanscv"></i>Sans CV</span><span><i class="dot dot-ia"></i>IA</span><span><i class="dot dot-autre"></i>Autre</span></div>
<div id="agendaData" class="agenda-data">Chargement du calendrier…</div>
<div class="agenda-actions"><button id="clearDate" class="clear-date" type="button">Aujourd’hui</button></div>
</div>
<div class="agenda-card"><div id="dayDetails" class="day-details"><div class="day-empty">Choisissez un jour dans le calendrier.</div></div></div>
</div>
</section>

<section id="viewer" class="viewer" aria-label="Résultats France Travail"><iframe id="frame" title="Résultats France Travail Île-de-France" loading="eager"></iframe></section>
</main>
<script src="events-idf.js"></script>
<script src="evenements-app.js"></script>
</body>
</html>
