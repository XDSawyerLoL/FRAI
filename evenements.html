<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Événements emploi — Île-de-France</title>
<style>
:root{--blue:#0063cb;--bg:#f5f7fa;--text:#1f2937;--muted:#667085;--line:#d0d5dd;--oa-crop:545px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,"Segoe UI",sans-serif;color:var(--text)}
.app{max-width:1450px;margin:auto;padding:16px}.box{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px}
h1{margin:0 0 5px;font-size:22px}.sub{font-size:13px;color:var(--muted);margin-bottom:14px}
.grid{display:grid;grid-template-columns:1fr 260px auto;gap:10px;align-items:end}.field{display:flex;flex-direction:column;gap:5px}.field label{font-size:12px;font-weight:700}
input,select,button{height:46px;border-radius:8px;font-size:15px}input,select{border:1px solid #aeb8c5;padding:0 12px;background:#fff}button{border:0;background:var(--blue);color:#fff;font-weight:700;padding:0 18px;cursor:pointer}
.quick{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}.chip{height:34px;background:#eef5ff;color:#064f9c;border:1px solid #bed8f3;border-radius:999px;font-size:13px;padding:0 12px}
.info{margin-top:10px;font-size:12px;color:var(--muted)}
.viewer{margin-top:12px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;height:820px;position:relative}
.viewer iframe{position:absolute;left:0;top:calc(-1 * var(--oa-crop));width:100%;height:calc(820px + var(--oa-crop));border:0;display:block;background:#fff}
@media(max-width:760px){:root{--oa-crop:610px}.grid{grid-template-columns:1fr}.viewer{height:720px}.viewer iframe{height:calc(720px + var(--oa-crop))}}
</style>
</head>
<body>
<main class="app">
<section class="box">
<h1>Recherche événements emploi — Île-de-France</h1>
<div class="sub">La recherche est limitée à l’Île-de-France. Le département n’est appliqué que si vous en choisissez un.</div>
<form id="f" class="grid">
<div class="field"><label for="q">Mot-clé</label><input id="q" value="MRS" placeholder="MRS, alternance, job dating…"></div>
<div class="field"><label for="zone">Zone</label><select id="zone">
<option value="idf">Toute l’Île-de-France</option>
<option value="75">Paris (75)</option>
<option value="77">Seine-et-Marne (77)</option>
<option value="78">Yvelines (78)</option>
<option value="91">Essonne (91)</option>
<option value="92">Hauts-de-Seine (92)</option>
<option value="93">Seine-Saint-Denis (93)</option>
<option value="94">Val-de-Marne (94)</option>
<option value="95">Val-d’Oise (95)</option>
</select></div>
<button type="submit">Rechercher</button>
</form>
<div class="quick">
<button class="chip" data-q="MRS" type="button">MRS</button>
<button class="chip" data-q="Job dating" type="button">Job dating</button>
<button class="chip" data-q="Alternance" type="button">Alternance</button>
<button class="chip" data-q="Recrutement sans CV" type="button">Sans CV</button>
<button class="chip" data-q="Intelligence artificielle" type="button">IA</button>
</div>
<div class="info" id="status">Recherche prête — Île-de-France uniquement.</div>
</section>
<section class="viewer" aria-label="Résultats France Travail"><iframe id="frame" title="Résultats France Travail Île-de-France" loading="eager"></iframe></section>
</main>
<script>
const zones={
 idf:{label:'Île-de-France',department:null},
 '75':{label:'Paris (75)',department:'Paris'},
 '77':{label:'Seine-et-Marne (77)',department:'Seine-et-Marne'},
 '78':{label:'Yvelines (78)',department:'Yvelines'},
 '91':{label:'Essonne (91)',department:'Essonne'},
 '92':{label:'Hauts-de-Seine (92)',department:'Hauts-de-Seine'},
 '93':{label:'Seine-Saint-Denis (93)',department:'Seine-Saint-Denis'},
 '94':{label:'Val-de-Marne (94)',department:'Val-de-Marne'},
 '95':{label:'Val-d’Oise (95)',department:"Val-d'Oise"}
};
const q=document.getElementById('q');
const zone=document.getElementById('zone');
const frame=document.getElementById('frame');
const status=document.getElementById('status');

function cleanKeyword(v){return (v||'').trim()||'MRS'}

function urlFor(keyword,key){
 const z=zones[key]||zones.idf;
 const u=new URL('https://openagenda.com/fr/francetravail');
 u.searchParams.set('search',cleanKeyword(keyword));
 u.searchParams.set('adminLevel1','Île-de-France');
 if(z.department){u.searchParams.set('adminLevel2',z.department)}
 u.searchParams.append('relative[]','current');
 u.searchParams.append('relative[]','upcoming');
 return u.toString();
}

function run(keyword,key){
 const z=zones[key]||zones.idf;
 q.value=cleanKeyword(keyword);
 zone.value=key;
 status.textContent='Résultats pour « '+q.value+' » — '+z.label;
 frame.src=urlFor(q.value,key);
}

document.getElementById('f').addEventListener('submit',e=>{e.preventDefault();run(q.value,zone.value)});
zone.addEventListener('change',()=>run(q.value,zone.value));
document.querySelectorAll('[data-q]').forEach(b=>b.addEventListener('click',()=>run(b.dataset.q,zone.value)));
run('MRS','idf');
</script>
</body>
</html>
